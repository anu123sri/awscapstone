name: TicketDesk CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ticketdesk-backend
  ECS_SERVICE: ticketdesk-backend-service
  ECS_CLUSTER: ticketdesk-cluster
  CLOUDFRONT_DISTRIBUTION_ID: E3VZTH6XGJXK77
  S3_FRONTEND_BUCKET: ticketdesk-frontend-5ujbds
  PROD_URL: https://d34fecnctmxvyw.cloudfront.net

jobs:
  # ===========================================================================
  # Stage 1: Security & Quality Checks (Secrets Scan + Unit Tests)
  # ===========================================================================
  quality-check:
    name: Security Scan & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Unit Tests
        run: |
          cd ticketdesk-backend
          mvn test -B

  # ===========================================================================
  # Stage 2: Build & Push Container Image to Amazon ECR
  # ===========================================================================
  build-and-push:
    name: Build & Push to ECR
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.prep.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Git SHA Tag
        id: prep
        run: |
          SHA_TAG=$(git rev-parse --short HEAD)
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.prep.outputs.sha_tag }}
        run: |
          cd ticketdesk-backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ===========================================================================
  # Stage 3: Deploy to AWS (ECS Fargate + S3 Frontend + CloudFront Invalidation)
  # ===========================================================================
  deploy:
    name: Deploy to Production
    needs: [quality-check, build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS Backend Service Deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Static Assets
        run: |
          cd ticketdesk-frontend
          npm ci || npm install
          npm run build

      - name: Sync Frontend to S3
        run: |
          aws s3 sync ticketdesk-frontend/dist/ s3://${{ env.S3_FRONTEND_BUCKET }}/ --delete

      - name: Invalidate CloudFront CDN Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # ===========================================================================
  # Stage 4: Smoke Test Verification
  # ===========================================================================
  smoke-test:
    name: Post-Deployment Smoke Test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Run Smoke Test against CloudFront Endpoint
        run: |
          echo "Waiting 15 seconds for rolling task stabilization..."
          sleep 15
          echo "Testing Production Health Endpoint: ${{ env.PROD_URL }}/api/health"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.PROD_URL }}/api/health)
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Smoke test PASSED with HTTP status $RESPONSE"
          else
            echo "Smoke test FAILED with HTTP status $RESPONSE"
            exit 1
          fi

      - name: Test Frontend Availability
        run: |
          echo "Testing Production Frontend: ${{ env.PROD_URL }}"
          FRONTEND_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.PROD_URL }})
          if [ "$FRONTEND_RESPONSE" -eq 200 ]; then
            echo "Frontend smoke test PASSED with HTTP status $FRONTEND_RESPONSE"
          else
            echo "Frontend smoke test FAILED with HTTP status $FRONTEND_RESPONSE"
            exit 1
          fi
