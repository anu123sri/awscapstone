services:
  db:
    image: mysql:8.0
    container_name: ticketdesk-db
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticketdesk_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./ticketdesk-backend
    container_name: ticketdesk-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/ticketdesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - TICKETDESK_JWT_SECRET=local-development-secret-change-this
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./ticketdesk-frontend
    container_name: ticketdesk-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
